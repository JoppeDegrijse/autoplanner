<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F2FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<title>Autoplanner</title>
<style>
:root{--blue:#2757E6;--or:#FF8A2B;--lime:#C8F24D;--ink:#17142B;--mute:#5A5675;--bg:#F5F2FF;--lt:#EFEBFF;--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:500 16px/1.35 'Bricolage Grotesque',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#app{padding:16px 20px calc(130px + var(--bot));min-height:100vh}
.h{font-size:28px;font-weight:800;letter-spacing:-.5px;flex:1}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.ib{width:44px;height:44px;border-radius:16px;background:#fff;display:grid;place-items:center}
.lab{font-size:13px;font-weight:700;color:var(--mute)}
.card{background:#fff;border-radius:24px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;flex:none}
.pill{border-radius:99px;padding:4px 12px;font-size:13px;font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.x{font-size:24px;width:36px;height:36px;color:var(--mute)}
.btn{height:56px;border-radius:20px;background:var(--blue);color:#fff;font-weight:800;font-size:17px;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:after{content:'';position:absolute;top:0;bottom:0;width:40px;background:rgba(255,255,255,.35);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
.cta{position:fixed;left:20px;right:20px;bottom:calc(24px + var(--bot));width:auto;z-index:4}.cta.n{bottom:calc(92px + var(--bot))}
.fab{position:fixed;right:20px;bottom:calc(92px + var(--bot));z-index:5;height:56px;border-radius:20px;background:var(--lime);display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-weight:800;font-size:16px;animation:fab 2.4s ease-in-out infinite;box-shadow:0 8px 20px rgba(23,20,43,.25)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;display:flex;justify-content:space-around;padding:10px 12px calc(10px + var(--bot));z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;min-width:70px;height:56px;justify-content:center;border-radius:20px;color:var(--mute)}
nav .on{background:#E3EAFF;color:#1B3FB8}
.seg{display:flex;background:#fff;border-radius:20px;padding:4px;margin:14px 0}.seg button{flex:1;height:44px;border-radius:16px;font-weight:800;font-size:15px}
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:18px 18px 0;height:150px;position:relative;overflow:hidden}.hero.busy{background:var(--ink)}
.hero h2{font-size:24px;font-weight:800;margin-top:10px;letter-spacing:-.4px;width:190px;line-height:1.15}.hero p{font-size:14px;margin-top:4px;width:190px}
.road{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--ink)}.hero.busy .road{background:#000}
.road i{position:absolute;left:0;right:0;top:11px;height:4px;background:repeating-linear-gradient(90deg,#F5F2FF 0 24px,transparent 24px 48px);animation:road .8s linear infinite}
.car{position:absolute;right:10px;bottom:10px;animation:bob 1.6s ease-in-out infinite}
.live{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}.live b{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:pulse 1.4s infinite}
.mh{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.mh h2{font-size:20px;font-weight:800;text-transform:capitalize}
.mh button{font-size:26px;width:36px;height:36px;border-radius:12px;background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal .w{font-size:12px;font-weight:700;color:var(--mute);text-align:center}
.c{height:44px;border-radius:14px;background:#fff;font-weight:700;font-size:15px}.cal .c.t,.wk .c.t{outline:3px solid var(--ink);outline-offset:1px}
.in{width:100%;height:52px;border-radius:16px;border:2px solid #E3DEFA;background:#fff;padding:0 14px;margin-top:6px;font-weight:700}
.in.b{font-size:20px;font-weight:800}
.two{display:flex;gap:12px;margin-top:16px}.two>div{flex:1}
.sw{width:56px;height:32px;border-radius:99px;background:var(--blue);padding:4px;display:flex;justify-content:flex-end;flex:none}.sw i{width:24px;height:24px;border-radius:50%;background:#fff;display:block}.sw.off{background:#C9C3E8;justify-content:flex-start}
.dt{flex:1;background:var(--bg);border-radius:18px;padding:12px 14px;position:relative;display:block}.dt b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.dt input,.dw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0}
.dw{position:relative}
.cam{position:relative;height:170px;border-radius:24px;background:var(--ink);display:flex;gap:6px;justify-content:center;align-items:center;overflow:hidden}
.cam u{position:absolute;left:12%;right:12%;height:3px;background:var(--lime);border-radius:3px;box-shadow:0 0 14px var(--lime);animation:scan 2.4s ease-in-out infinite}
.cam em{font-style:normal;width:34px;height:48px;border-radius:10px;background:#2C2750;color:var(--lime);display:grid;place-items:center;font-size:28px;font-weight:700}
.cam s{position:absolute;width:22px;height:22px;border:3px solid var(--lime)}
.rc{position:relative;height:150px;border-radius:24px;border:3px dashed #B9AEF0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;text-align:center;padding:0 24px;margin-top:12px}
.rc u{position:absolute;left:10%;right:10%;height:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 12px var(--blue);animation:scan 2.6s ease-in-out infinite}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--lime);border-radius:99px;padding:8px 14px;font-weight:800;color:var(--ink)}
.ghost{height:44px;border-radius:16px;background:#fff;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:700}
.who{display:flex;gap:8px;margin-top:8px}.who button{flex:1;height:48px;border-radius:16px;background:#fff;font-weight:800;font-size:15px}
.track{background:var(--lt);border-radius:99px;margin:6px 0 12px}.bar{height:14px;border-radius:99px;transform-origin:left}
.tl{position:relative;margin-top:16px}.tl .rd{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:28px;background:var(--ink)}
.tl .rd i{position:absolute;left:26px;width:4px;top:0;bottom:0;background:repeating-linear-gradient(180deg,#F5F2FF 0 24px,transparent 24px 48px);animation:lane .8s linear infinite}
.rt{position:relative;margin:0 0 14px 70px}.mk{position:absolute;left:-54px;top:18px;width:32px;height:32px;border-radius:50%;border:4px solid var(--bg);box-shadow:0 0 0 3px var(--ink)}
.pay{background:var(--ink);color:#fff;border-radius:28px;padding:16px 18px;margin-top:10px}
#scrim{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + var(--bot));transform:translateY(105%);transition:transform .22s ease;max-height:85%;overflow-y:auto;z-index:10}
body.open #scrim{opacity:1;pointer-events:auto}body.open #sheet{transform:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(150px + var(--bot));background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.on{opacity:1}
.anim .up{animation:up .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*70ms)}
.anim .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i,0)*25ms + .2s)}
.anim .gr{animation:grow .9s .3s cubic-bezier(.2,.9,.3,1) both}.anim .gy{animation:growy .8s .3s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:bottom}
.bob{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,242,77,.7)}100%{box-shadow:0 0 0 12px rgba(200,242,77,0)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes road{to{background-position:-48px 0}}@keyframes lane{to{background-position:0 48px}}
@keyframes shine{0%{left:-60px}60%,100%{left:110%}}@keyframes scan{0%,100%{top:10%}50%{top:84%}}
@keyframes fab{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes grow{from{transform:scaleX(0)}}@keyframes growy{from{transform:scaleY(0)}}
@keyframes fillg{from{stroke-dashoffset:220}}@keyframes coin{0%{left:0;opacity:0}15%,85%{opacity:1}100%{left:calc(100% - 30px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="anim"></div><div id="scrim" data-act="close"></div><div id="sheet"></div><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwXCURVE-CWmnbBivbrDVDPMOGWioOzEtv3KyPxfIwicBauJTVISnl2UIKHdV10Bjca/exec';
const $=s=>document.querySelector(s),LS=localStorage;
const NAMES=['Joppe','Iebe'],P={Joppe:{bg:'#2757E6',fg:'#fff'},Iebe:{bg:'#FF8A2B',fg:'#17142B'},Beide:{bg:'#17142B',fg:'#fff'}};
const other=n=>n==='Joppe'?'Iebe':'Joppe';
const cfg={key:LS.getItem('ap_key')||'',me:LS.getItem('ap_me')||''};
let data={ritten:[],afrekeningen:[],...JSON.parse(LS.getItem('ap_data')||'{"reserveringen":[],"tankbeurten":[]}')};
let pending=0,view='home',D={},cur=new Date();cur.setDate(1);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=()=>iso(new Date()),dd=k=>new Date(k+'T00:00');
const fd=k=>dd(k).toLocaleDateString('nl-BE',{weekday:'short',day:'numeric',month:'short'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const nl=n=>n.toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2}),eur=n=>'€ '+nl(n);
const fk=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const mins=t=>t?(+t.slice(0,2))*60+(+t.slice(3,5)):0;
const dn=k=>Math.floor(new Date(k+'T00:00:00Z')/864e5);
const rng=r=>[dn(r.datum)*1440+(r.van?mins(r.van):0),dn(r.eind||r.datum)*1440+(r.tot?mins(r.tot):1440)];
const multi=r=>r.eind&&r.eind!==r.datum,cov=(r,k)=>r.datum<=k&&(r.eind||r.datum)>=k;
const tspan=r=>multi(r)?(fd(r.datum)+' '+(r.van||'')+' tot '+fd(r.eind)+' '+(r.tot||'')).replace(/ +/g,' ').trim():(r.van&&r.tot?r.van+' tot '+r.tot:'hele dag');
const svg=(p,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 11h18"/>',pump:'<path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M15 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V9l-3-3"/><path d="M8 8h4"/>',route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>',bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',back:'<path d="M15 6l-6 6 6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',ok:'<path d="M5 12l5 5 9-10"/>',arr:'<path d="M5 12h14M13 6l6 6-6 6"/>',re:'<path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 10A8 8 0 0 0 6 6L4 10M4 14a8 8 0 0 0 14 4l2-4"/>'};
const ic=(n,s)=>svg(IC[n],s);
const CAR='<svg width="150" height="76" viewBox="0 0 150 76" aria-hidden="true"><rect x="6" y="32" width="138" height="26" rx="12" fill="#C8F24D"/><path d="M36 32L50 11Q53 7 58 7H92Q97 7 101 11L116 32Z" fill="#C8F24D"/><path d="M46 30L56 14H70V30ZM76 30V14H92L103 30Z" fill="#17142B"/><g style="transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite"><circle cx="38" cy="60" r="12" fill="#17142B"/><path d="M38 51V69M29 60H47" stroke="#F5F2FF" stroke-width="3"/></g><g style="transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite"><circle cx="112" cy="60" r="12" fill="#17142B"/><path d="M112 51V69M103 60H121" stroke="#F5F2FF" stroke-width="3"/></g></svg>';
const pill=n=>`<span class="pill" style="background:${P[n].bg};color:${P[n].fg}">${n}</span>`;
const av=n=>`<span class="av" style="background:${P[n].bg};color:${P[n].fg}">${n[0]}</span>`;
const dot=n=>`<span class="dot" style="background:${P[n].bg}"></span>`;
const own=n=>n===cfg.me||n==='Beide';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3200)}
const needMe=()=>{if(!cfg.me){toast('Kies eerst of je Joppe of Iebe bent.');return true}};
const save=()=>LS.setItem('ap_data',JSON.stringify(data));

async function sync(){
  if(!cfg.key||pending)return;
  try{
    const j=await (await fetch(API+'?key='+encodeURIComponent(cfg.key))).json();
    if(pending)return;
    if(j.error){toast(j.error==='Geen toegang'?'Sleutel klopt niet. Pas hem aan via het tandwiel.':j.error);return}
    data={ritten:[],afrekeningen:[],...j};save();render(true);
  }catch(e){toast('Geen verbinding. Je ziet de laatst bewaarde gegevens.')}
}
async function call(body){
  const j=await (await fetch(API,{method:'POST',body:JSON.stringify({key:cfg.key,...body})})).json();
  if(j.error)throw new Error(j.error);return j;
}
const listOf=t=>({reservering:'reserveringen',tankbeurt:'tankbeurten',rit:'ritten',afrekening:'afrekeningen'})[t];
async function add(type,item){
  const k=listOf(type),tmp={...item,id:'tmp'+Date.now()};
  data[k].push(tmp);render(true);pending++;
  try{const j=await call({action:'add',type,data:item});tmp.id=j.id;save()}
  catch(e){data[k]=data[k].filter(x=>x!==tmp);render(true);toast('Opslaan mislukt: '+e.message)}finally{pending--}
}
async function del(type,id){
  const k=listOf(type),old=data[k];
  data[k]=old.filter(x=>x.id!==id);render(true);pending++;
  try{await call({action:'delete',type,id});save()}
  catch(e){data[k]=old;render(true);toast('Verwijderen mislukt')}finally{pending--}
}

function stats(extra){
  const r=data.ritten.concat(extra||[]).filter(x=>+x.kmstand).sort((a,b)=>a.kmstand-b.kmstand),km={Joppe:0,Iebe:0},paid={Joppe:0,Iebe:0},legs=[];
  for(let i=1;i<r.length;i++){const d=r[i].kmstand-r[i-1].kmstand;legs.push({...r[i],from:r[i-1].kmstand,dist:d});
    if(r[i].persoon==='Beide'){km.Joppe+=d/2;km.Iebe+=d/2}else if(km[r[i].persoon]!==undefined)km[r[i].persoon]+=d}
  data.tankbeurten.forEach(x=>{if(paid[x.persoon]!==undefined)paid[x.persoon]+=num(x.bedrag)});
  const total=km.Joppe+km.Iebe,cost=paid.Joppe+paid.Iebe,rate=total>0?cost/total:0;
  let bal=paid.Joppe-km.Joppe*rate;
  data.afrekeningen.forEach(a=>{const b=num(a.bedrag);if(a.betaler==='Iebe')bal-=b;else if(a.betaler==='Joppe')bal+=b});
  return{r,legs,km,paid,total,cost,rate,bal};
}
const owe=b=>Math.abs(b)<.005?null:(b>0?['Iebe','Joppe']:['Joppe','Iebe']);
function gauge(){
  const f=data.tankbeurten.filter(x=>x.datum).sort((a,b)=>a.datum.localeCompare(b.datum));
  if(!f.length)return null;
  const last=f[f.length-1];if(last.vol==='nee')return{last,unk:1};
  const s=stats(),cap=Math.max(...f.map(x=>num(x.liters)))||50,cons=s.total>100?s.cost>0?data.tankbeurten.reduce((a,x)=>a+num(x.liters),0)/s.total*100:7:7;
  let since=0;if(s.r.length){const base=s.r.filter(x=>x.datum<=last.datum).pop()||s.r[0];since=s.r[s.r.length-1].kmstand-base.kmstand}
  return{last,lv:Math.max(0,Math.min(1,1-since*cons/100/cap))};
}
function carState(){
  const n=new Date(),nm=dn(T())*1440+n.getHours()*60+n.getMinutes(),rs=data.reserveringen.filter(r=>r.datum).map(r=>({r,a:rng(r)[0],b:rng(r)[1]}));
  const c=rs.find(x=>x.a<=nm&&nm<x.b),nx=rs.filter(x=>x.a>nm).sort((x,y)=>x.a-y.a)[0];
  return{c:c&&c.r,nx:nx&&nx.r};
}
function dayStyle(k,extra){
  const c=[...new Set(data.reserveringen.filter(r=>cov(r,k)).map(r=>r.persoon).concat(extra?[extra]:[]))];
  if(!c.length)return'';
  return c.length>1?`;background:linear-gradient(135deg,${P[c[0]].bg} 50%,${P[c[1]].bg} 50%);color:#fff`:`;background:${P[c[0]].bg};color:${P[c[0]].fg}`;
}
const hd=(t,back)=>`<div class="top up"><button class="ib" data-act="go" data-v="${back}" aria-label="Terug">${ic('back')}</button><h1 class="h">${t}</h1></div>`;
const as=()=>cfg.me?`${dot(cfg.me)} `:'';

function vHome(){
  const s=carState(),y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=T();
  let c=['ma','di','wo','do','vr','za','zo'].map(d=>`<span class="w">${d}</span>`).join('')+'<span></span>'.repeat(off);
  for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<button class="c pop${k===t?' t':''}" style="--i:${d}${dayStyle(k)}" data-act="dayp" data-d="${k}" aria-label="${d}">${d}</button>`}
  const up=data.reserveringen.filter(r=>(r.eind||r.datum)>=t).sort((a,b)=>a.datum.localeCompare(b.datum)).slice(0,6);
  const endTxt=r=>fd(r.eind||r.datum)+(r.tot?' '+r.tot:'');
  return `<div class="top up"><h1 class="h">Hoi ${cfg.me||'daar'}</h1><button class="ib" data-act="setup" aria-label="Instellingen">${ic('gear')}</button></div>
<div class="seg up" style="--i:1" role="group" aria-label="Wie ben jij">${NAMES.map(n=>`<button data-act="who" data-n="${n}"${n===cfg.me?` style="background:${P[n].bg};color:${P[n].fg}"`:''}>Ik ben ${n}</button>`).join('')}</div>
<div class="hero${s.c?' busy':''} up" style="--i:2"><span class="live"><b></b>${s.c?'Bezet':'Nu vrij'}</span><h2>${s.c?s.c.persoon+' heeft de auto':'Auto staat klaar'}</h2><p>${s.c?'Tot '+endTxt(s.c):s.nx?'Volgende: '+s.nx.persoon+', '+fd(s.nx.datum):'Niets gepland'}</p><div class="road"><i></i></div><div class="car">${CAR}</div></div>

function sheet(h){$('#sheet').innerHTML=h;document.body.classList.add('open')}
function setupSheet(){
  const pick=NAMES.map(n=>`<label style="flex:1"><input type="radio" name="me" value="${n}" ${n===cfg.me?'checked':''} style="accent-color:${P[n].bg}"> ${n}</label>`).join('');
  sheet(`<h2 style="font-size:22px;font-weight:800;margin-bottom:12px">Instellingen</h2>${cfg.me?'':`<p class="lab" style="margin-bottom:6px">Wie ben jij?</p><div class="row" style="margin-bottom:12px;font-weight:700">${pick}</div>`}<p class="lab">Geheime sleutel</p><input class="in" id="kk" type="password" value="${cfg.key}" autocomplete="off"><button class="btn" style="margin-top:14px" data-act="savecfg">Opslaan</button>`);
}
function saveRes(){
  if(needMe())return;const{ad,ds,de,ts,te,note}=D,t1=ad?'':ts,t2=ad?'':te;
  if(!ds||!de||de<ds||(!ad&&(!t1||!t2||(de===ds&&t2<=t1)))){toast('Het einde moet na het begin liggen.');return}
  const nr={datum:ds,eind:de>ds?de:'',persoon:cfg.me,van:t1,tot:t2,opmerking:(note||'').trim()},[a,b]=rng(nr),c=data.reserveringen.find(r=>a<rng(r)[1]&&rng(r)[0]<b);
  if(c){toast('Overlapt met '+c.persoon+' ('+tspan(c)+').');return}
  add('reservering',nr);go('home');
}
document.addEventListener('click',e=>{
  const nv=e.target.closest('nav button');if(nv){go(nv.dataset.v);return}
  const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
  ({go:()=>go(d.v),
   prev:()=>{cur.setMonth(cur.getMonth()-1);render()},next:()=>{cur.setMonth(cur.getMonth()+1);render()},
   dayp:()=>go('res',{ds:d.d,de:d.d}),
   who:()=>{cfg.me=d.n;LS.setItem('ap_me',cfg.me);render()},
   tgl:()=>{D[d.k]=!D[d.k];render()},rw:()=>{D.who=d.n;render()},meth:()=>{D.meth=d.m;render()},
   setup:setupSheet,close:()=>document.body.classList.remove('open'),
   savecfg:()=>{const r=document.querySelector('input[name=me]:checked');cfg.me=(r&&r.value)||cfg.me;cfg.key=$('#kk').value.trim();LS.setItem('ap_me',cfg.me);LS.setItem('ap_key',cfg.key);document.body.classList.remove('open');render();sync()},
   resv:saveRes,
   delr:()=>del('reservering',d.id),
   delt:()=>{if(confirm('Deze tankbeurt verwijderen?'))del('tankbeurt',d.id)},
   delrit:()=>{if(confirm('Deze kilometerstand verwijderen?'))del('rit',d.id)},
   delaf:()=>{if(confirm('Deze afrekening verwijderen?'))del('afrekening',d.id)},
   tbsave:()=>{if(needMe())return;const b=num(D.bedrag),l=num(D.liters);if(b<=0||l<=0){toast('Vul bedrag en liters in.');return}
     add('tankbeurt',{datum:D.datum,persoon:cfg.me,liters:l,bedrag:b,vol:D.vol?'ja':'nee'});go('tanken')},
   ritsave:()=>{if(needMe())return;const k=num(D.km),last=Math.max(0,...data.ritten.map(x=>+x.kmstand||0));
     if(!k){toast('Neem een foto of typ de kilometerstand.');return}if(last&&k<=last){toast('Deze stand moet hoger zijn dan de vorige ('+fk(last)+' km).');return}
     add('rit',{datum:T(),persoon:D.who||cfg.me,kmstand:k});go('ritten')},
   afsave:()=>{if(needMe())return;const{o,amt}=afInfo();if(amt<=0){toast('Vul een bedrag in.');return}
     add('afrekening',{datum:T(),betaler:o[0],ontvanger:o[1],bedrag:amt,methode:D.meth});go('afrek')}
  })[d.act]?.();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k&&t.type!=='date'){D[t.dataset.k]=t.value;if(t.dataset.u)UPD[t.dataset.u]()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='date'&&t.dataset.k){D[t.dataset.k]=t.value;if(D.de<D.ds)D.de=D.ds;render()}
  if(t.id==='bonf'){readImg(t.files[0],'receipt',j=>{if(j.bedrag)D.bedrag=nl(num(j.bedrag));if(j.liters)D.liters=nl(num(j.liters)).replace(/,00$/,'')});t.value=''}
  if(t.id==='kmf'){readImg(t.files[0],'odometer',j=>{D.km=j.km;D.read=true});t.value=''}
});
render();
if(!cfg.key||!cfg.me)setupSheet();else sync();
setTimeout(()=>$('#app').classList.remove('anim'),1300);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
